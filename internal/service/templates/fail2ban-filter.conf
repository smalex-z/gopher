[Definition]
# All of these come from AuthService.logEvent's uniform "gopher-auth: <KIND>
# ip=<IP>" line, so adding coverage here is just adding the literal KIND —
# no code change needed. Scoped to dashboard-adjacent auth (password login,
# TOTP/2FA, and the step-up re-auth on sensitive ops): all guard credentials
# the operator alone is expected to know, same proportionality as the
# original two patterns. Deliberately NOT extended to the per-tunnel
# password gate (internal/proxy) — that guards a potentially
# team/shared password, so an all-ports ban on a mistyped attempt there
# is disproportionate; it has its own in-process throttle instead.
failregex = gopher-auth: LOGIN_FAILED ip=<HOST>
            gopher-auth: LOGIN_RATE_LIMITED ip=<HOST>
            gopher-auth: LOGIN_FAILED_TOTP ip=<HOST>
            gopher-auth: LOGIN_TOTP_RATE_LIMITED ip=<HOST>
            gopher-auth: LOGIN_FAILED_2FA_EXPIRED ip=<HOST>
            gopher-auth: TOTP_RATE_LIMITED ip=<HOST>
            gopher-auth: SENSITIVE_OP_FAILED_2FA ip=<HOST>
ignoreregex =
