name: Go Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure embedded frontend path exists
        run: |
          mkdir -p cmd/server/frontend/dist
          if [ ! -f cmd/server/frontend/dist/index.html ]; then
            cat > cmd/server/frontend/dist/index.html <<'EOF'
            <!doctype html>
            <html><head><meta charset="utf-8"></head><body></body></html>
            EOF
          fi

      - name: Run tests
        run: |
          set -euo pipefail
          go test -v ./... | tee test_output.txt

      - name: Run coverage
        run: |
          set -euo pipefail
          go test -v -coverprofile=coverage.out -coverpkg=./... ./tests/unit/... | tee -a test_output.txt

      - name: Generate coverage summary
        run: |
          if [ -s coverage.out ]; then
            go tool cover -func=coverage.out | tee coverage_summary.txt
          else
            echo "No coverage data generated" | tee coverage_summary.txt
          fi

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage_summary.txt

      - name: Comment test summary on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: coverage_summary.txt
