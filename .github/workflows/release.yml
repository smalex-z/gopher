name: Release

# A tag push (or manual dispatch) may only publish binaries after every gate
# job passes — the release job `needs:` all of them. Before this gate existed,
# tagging published artifacts with zero tests run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (example: v0.1.0-rc.1)'
        required: true
        type: string

# Default every job to read-only; only the release job below gets
# contents:write (it must publish the release). The gate jobs run tests on a
# GITHUB_TOKEN that cannot touch the repo, so a compromised test dependency
# or action can't publish or modify anything.
permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  gate-go:
    name: Gate / Go tests (-race) + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checkout release tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags --force
          git checkout "tags/${TAG}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Ensure embedded frontend path exists
        run: |
          mkdir -p cmd/server/frontend/dist
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>' > cmd/server/frontend/dist/index.html
      - run: go vet ./...
      - run: go test -race ./...

  gate-frontend:
    name: Gate / frontend lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checkout release tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags --force
          git checkout "tags/${TAG}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint (zero warnings)
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

  gate-shell:
    name: Gate / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checkout release tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags --force
          git checkout "tags/${TAG}"
      - name: Install shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck
      - name: Shellcheck operator scripts, test harness, embedded templates
        # -x follows `source`; the embedded templates (bootstrap.sh 400+
        # lines, migrate.sh, gopher-uninstall.sh) run unattended as root on
        # users' machines — this is their only automated coverage.
        run: shellcheck -x -S warning scripts/*.sh tests/*.sh internal/api/handlers/templates/*.sh internal/ssh/templates/*.sh

  gate-integration:
    name: Gate / integration tests on full artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checkout release tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags --force
          git checkout "tags/${TAG}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        run: sudo apt-get install -y --no-install-recommends jq sqlite3
      - name: Build full artifact (frontend + fetch-deps + embed)
        # scripts/build.sh is the same recipe the release build uses, so the
        # integration tests below exercise the artifact shape that ships —
        # including the embedded caddy/rathole payload.
        run: ./scripts/build.sh
      - name: Smoke-check embedded payload
        run: |
          ./gopher version
          ./gopher version | grep -q 'embedded: true'
      - name: Run shell integration tests
        run: |
          chmod +x tests/*.sh
          ./tests/critical-path.sh
          ./tests/config-validation.sh
          ./tests/idempotency.sh
          ./tests/state-reconciliation.sh

  release:
    name: Build and Release
    needs: [gate-go, gate-frontend, gate-shell, gate-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub release; every other job stays read-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure tag exists (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags --force
          git rev-parse "refs/tags/${TAG}" >/dev/null

      - name: Checkout release tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: git checkout "tags/${TAG}"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build gopher-agent (linux amd64 + arm64 + armv7)
        # The server embeds these binaries via //go:embed all:agents and serves
        # them at /static/agents/<arch>; without this step the published
        # release artifact 404s on every agent download from a bootstrapping
        # client, breaking the migration / agent install flow entirely.
        # Mirrors the local scripts/build.sh agent step. armv7 keeps 32-bit ARM
        # origins fully managed (GOARM=7 = hard-float, matches rathole musleabihf).
        run: |
          mkdir -p cmd/server/agents
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o cmd/server/agents/gopher-agent-linux-amd64 ./cmd/agent/
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o cmd/server/agents/gopher-agent-linux-arm64 ./cmd/agent/
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o cmd/server/agents/gopher-agent-linux-armv7 ./cmd/agent/

      - name: Build linux binaries
        # Each gopher binary bundles caddy (matching arch) + rathole (all origin
        # arches) via //go:embed; scripts/fetch-deps.sh stages them per GOARCH
        # before each build. Without it the released binary has no bundled
        # caddy/rathole and the supervised edge can't start.
        run: |
          mkdir -p dist
          GOARCH=amd64 ./scripts/fetch-deps.sh
          GOOS=linux GOARCH=amd64 go build -ldflags "-X github.com/smalex-z/gopher/internal/build.Version=${TAG}" -o dist/gopher-linux-amd64 ./cmd/server/...
          GOARCH=arm64 ./scripts/fetch-deps.sh
          GOOS=linux GOARCH=arm64 go build -ldflags "-X github.com/smalex-z/gopher/internal/build.Version=${TAG}" -o dist/gopher-linux-arm64 ./cmd/server/...
          sha256sum dist/gopher-linux-amd64 dist/gopher-linux-arm64 > dist/SHA256SUMS.txt

      - name: Smoke-check release artifact
        # The runner is amd64 — execute the exact binary being published and
        # assert it self-reports the release tag and an embedded payload.
        run: |
          chmod +x dist/gopher-linux-amd64
          ./dist/gopher-linux-amd64 version
          ./dist/gopher-linux-amd64 version | grep -qF "gopher ${TAG} "
          ./dist/gopher-linux-amd64 version | grep -q 'embedded: true'

      - name: Determine prerelease flag
        id: release_meta
        run: |
          if [[ "${TAG}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        # Stable tags are created as DRAFTS: the repo has immutable releases
        # enabled, so a release freezes (assets locked, undeletable) the moment
        # it is published — the offline minisign signature must therefore be
        # attached BEFORE publish. scripts/sign-release.sh signs the draft and
        # flips it live as its final step. Prereleases (alpha/beta) publish
        # directly, unsigned — the updater tolerates that on those channels,
        # and immutability freezes them as-is.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          draft: ${{ steps.release_meta.outputs.prerelease == 'false' }}
          # Stable drafts carry a one-line banner against publishing from the
          # UI — doing so would freeze the release unsigned (immutable
          # releases), permanently refused by every updater, burning the
          # version number. sign-release.sh strips the line when it publishes.
          body: ${{ steps.release_meta.outputs.prerelease == 'false' && '⚠️ DO NOT publish this draft from the GitHub UI — immutable releases freeze on publish, and an unsigned stable release is permanently refused by every updater. Run scripts/sign-release.sh instead; it signs and publishes atomically.' || '' }}
          files: |
            dist/gopher-linux-amd64
            dist/gopher-linux-arm64
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
