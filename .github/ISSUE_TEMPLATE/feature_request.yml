name: Feature request
description: Propose an improvement or new capability
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The situation that made you want this — not yet the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like gopher to do, as concretely as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you're using today, or other designs that could solve it.
